[package]
name = "amoxtli"
version = "2.0.0"
edition = "2021"
description = "A native Markdown editor for GNOME and Linux"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_49"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
pulldown-cmark = { version = "0.13", default-features = false }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libc = "0.2"
# already built for syntect; look-around in the source editor's syntax patterns
fancy-regex = "0.16"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
